<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Universo de Flores Amarillas 🌻</title>

    <!-- MAPA DE IMPORTACIONES (Resuelve el error "Failed to resolve module specifier") -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",

        }
    }

<body>

    <div id="intro">
        <div class="intro-content">
            <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1>

            <button id="startBtn">Entrar al Universo ✨</button>
        </div>
    </div>

    <div id="overlay">
        <h2 id="floatingTitle">Universo de Flores Amarillas ✨</h2>
        <div id="phraseContainer"></div>
    </div>

    <script type="module" src="main.js"></script>

</body><!-- Modal para leer los versos de las cartas -->
<div id="letterModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 5, 27, 0.85); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center; color: #fff; font-family: sans-serif;">
  <div style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(253, 224, 71, 0.4); padding: 30px; border-radius: 15px; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(253, 224, 71, 0.3); position: relative;">
    <span id="closeModal" style="position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; color: #fde047;">✕</span>

  </div>
